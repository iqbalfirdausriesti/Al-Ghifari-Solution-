name: Download Foto Produk

on:
  workflow_dispatch:
    inputs:
      ulang_semua:
        description: "Hapus semua foto lama lalu unduh ulang (true/false)"
        default: "true"
      nomor:
        description: "Opsional: hanya baris No tertentu, contoh 15,16,35"
        default: ""

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache model CLIP
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-base-patch32

      - name: Install dependencies
        run: |
          pip install openpyxl requests pillow ddgs
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Jalankan skrip download foto
        env:
          ULANG_SEMUA: ${{ github.event.inputs.ulang_semua }}
          NOMOR: ${{ github.event.inputs.nomor }}
        run: python download_foto.py

      - name: Commit foto dan update Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.jpg' daftar-produk.xlsx foto-laporan.csv
          git commit -m "chore: unduh foto produk (terverifikasi)" || echo "Tidak ada perubahan baru"
          git pull --rebase origin main
          git push
