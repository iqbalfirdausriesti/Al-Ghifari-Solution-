<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Ghifari Solution — Admin Panel</title>
<style>
:root{
  --bg:#0b0e14;
  --panel:#12161f;
  --card:#171c28;
  --card2:#1c2231;
  --line:#242b3a;
  --line2:#313b50;
  --ink:#e9eef8;
  --mute:#8d98b0;
  --brand:#4b78ff;
  --green:#24d18f;
  --green-dim:#24d18f26;
  --orange:#ff6a1a;
  --gold:#d8b46a;
  --red:#ef4444;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.app{display:flex;flex-direction:column;height:100vh}

/* Top Navigation Bar (referensi style) */
.topbar{height:54px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2b60ff,#ff6a1a);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900}
.brand small{font-size:12px;font-weight:600;color:var(--mute);margin-left:4px}

.navtabs{display:flex;align-items:center;gap:4px;margin-left:8px}
.navtabs button{background:transparent;border:0;color:var(--mute);padding:7px 11px;border-radius:8px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.navtabs button:hover{color:var(--ink);background:#ffffff08}
.navtabs button.active{color:#fff;background:var(--card2)}
.navtabs .pill{background:#2a3245;color:var(--ink);font-size:10.5px;padding:1px 6px;border-radius:99px;font-weight:700}
.navtabs .pill.hot{background:var(--orange);color:#fff}

.search-wrap{flex:1;max-width:360px;min-width:150px}
.search-wrap input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;outline:0;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--brand)}

.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #24d18f33}
.btn-reload{background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.btn-reload:hover{border-color:var(--green);color:#fff}

/* Main Workspace */
.main{flex:1;display:flex;min-height:0;overflow:hidden}
.sidebar{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:10px 8px}
.sb-sec{margin-bottom:14px}
.sb-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--mute);padding:4px 10px 6px;text-transform:uppercase}
.sb-item{width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;color:#b8c2d6;font-size:12.5px;font-weight:500;transition:background .12s,color .12s}
.sb-item:hover{background:#ffffff08;color:#fff}
.sb-item.active{background:var(--card2);color:#fff;font-weight:700}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.sb-dot.dim{background:#475569}
.sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-cnt{font-size:11.5px;font-weight:700;color:var(--mute)}
.sb-item.active .sb-cnt{color:var(--green)}

.content{flex:1;overflow-y:auto;padding:16px 20px;min-width:0}

/* Right Content Header & Boxes */
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:17px;font-weight:800}
.stat-meta{font-size:12px;color:var(--mute)}
.badge-ok{background:#12382b;border:1px solid #24d18f55;color:var(--green);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.badge-warn{background:#3b2012;border:1px solid #ff6a1a55;color:#ff9b66;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}

.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{border-color:#64748b;color:#fff}
.btn-primary{background:linear-gradient(135deg,#2563eb,#4b78ff);border-color:#4b78ff;color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-green{background:#12382b;border-color:#24d18f66;color:var(--green)}
.btn-green:hover{background:#184938}
.btn-danger{background:#3b161b;border-color:#ef444466;color:#fca5a5}
.btn-danger:hover{background:#521c24}

/* Config / Bulk Box */
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.box-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;align-items:end}
.fg label{display:block;font-size:11px;color:var(--mute);margin-bottom:4px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:0}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand)}
.preview-box{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);font-size:12px;display:none}

/* Table */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);background:#10141d;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #1e2534;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#ffffff04}

.thumb{width:42px;height:42px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;display:block;border:1px solid var(--line2);cursor:pointer}
.thumb-vid{width:74px;height:42px;border-radius:8px;background:#000;object-fit:cover;display:block;border:1px solid var(--line2)}
.p-name{font-weight:700;font-size:13px;color:#fff}
.p-sub{font-size:11px;color:var(--mute);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag-3d{background:#2d2412;color:var(--gold);border:1px solid #d8b46a55;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700}
.tag-type{background:#1b263d;color:#93c5fd;border:1px solid #3b82f655;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.price-pr{font-weight:700;color:#fff;white-space:nowrap}
.price-old{font-size:11px;color:var(--mute);text-decoration:line-through;white-space:nowrap}

/* Toggle Switch (Referensi hijau terang) */
.sw{position:relative;display:inline-flex;align-items:center;width:40px;height:22px;vertical-align:middle}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:#333d52;transition:.18s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 4px #0006}
.sw input:checked + i{background:#26c987}
.sw.fs input:checked + i{background:var(--orange)}
.sw input:checked + i::after{transform:translateX(18px)}
.sw input:disabled + i{opacity:.45;cursor:wait}

/* Cards grid for Banner & Media */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mcard-media{height:165px;background:#0a0d14;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.mcard-media img{max-width:100%;max-height:100%;object-fit:contain}
.mcard-media.cover img{width:100%;height:100%;object-fit:cover}
.mcard-badge{position:absolute;left:10px;top:10px;background:#0b0e14dd;border:1px solid var(--line2);padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;color:var(--gold)}
.mcard-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard-body h3{margin:0;font-size:14px;color:#fff}
.mcard-body p{margin:0;font-size:12px;color:var(--mute);line-height:1.45}
.mcard-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#10141d}

/* Modal */
.modal-bg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:650px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px #000b}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{margin:0;font-size:15px}
.modal-bd{padding:16px 18px;overflow-y:auto;display:grid;gap:12px}
.modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#10141d}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Upload Row */
.up-row{display:flex;align-items:center;gap:8px}
.up-row input[type=text]{flex:1}
.up-preview{width:42px;height:42px;border-radius:8px;background:#fff;object-fit:contain;border:1px solid var(--line2);flex:none;padding:2px}
.btn-up{background:#18243b;border:1px solid #3b82f666;color:#93c5fd;padding:7px 10px;border-radius:8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.btn-up:hover{background:#213152;color:#fff}
.btn-up:disabled{opacity:.5;cursor:wait}

.toast{position:fixed;right:18px;bottom:18px;background:#141a26;border:1px solid var(--green);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:80;box-shadow:0 12px 28px #000a;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:none}
.toast.err{border-color:var(--red)}

.loading-mask{position:fixed;inset:0;background:#0b0e14dd;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spinner{width:30px;height:30px;border:3px solid var(--line2);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:840px){
  .topbar{height:auto;flex-wrap:wrap;padding:10px}
  .search-wrap{order:4;max-width:none;flex:1 0 100%}
  .main{flex-direction:column}
  .sidebar{width:100%;height:auto;max-height:150px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;gap:8px;overflow-x:auto}
  .sb-sec{display:flex;align-items:center;gap:4px;margin:0}
  .sb-title{display:none}
  .sb-item{width:auto;white-space:nowrap}
  .grid2,.grid3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="loading-mask" id="loadingMask">
  <div class="spinner"></div>
  <div style="font-weight:600;color:#cbd5e1">Memuat Al Ghifari Admin Panel...</div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <span>Al Ghifari <small>Admin Panel</small></span>
    </div>
    <nav class="navtabs" id="navTabs">
      <button class="active" data-tab="produk" onclick="switchTab('produk')">Produk <span class="pill" id="cntProd">0</span></button>
      <button data-tab="flash" onclick="switchTab('flash')">Flash Sale <span class="pill hot" id="cntFlash">0</span></button>
      <button data-tab="video" onclick="switchTab('video')">Video Trending <span class="pill" id="cntVid">0</span></button>
      <button data-tab="banner" onclick="switchTab('banner')">Banner Hero <span class="pill" id="cntHero">0</span></button>
      <button data-tab="setting" onclick="switchTab('setting')">Pengaturan</button>
      <button data-tab="log" onclick="switchTab('log')">Log Harga</button>
    </nav>
    <div class="search-wrap">
      <input id="searchInput" placeholder="Cari produk, merk, kategori, video..." oninput="renderMain()">
    </div>
    <div class="top-right">
      <span class="live-pill"><span class="live-dot"></span><span id="liveText">live</span></span>
      <button class="btn-reload" onclick="refreshAll()">↻ Muat ulang</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="content" id="contentArea"></section>
  </div>
</div>

<!-- Modal Form Dinamis -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hd">
      <h3 id="modalTitle">Edit Data</h3>
      <button class="btn" style="padding:4px 10px" onclick="closeModal()">×</button>
    </div>
    <div class="modal-bd" id="modalBody"></div>
    <div class="modal-ft" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STATE = {
  userEmail: "",
  updatedAt: "",
  siteUrl: "https://iqbalfirdausriesti.github.io/Al-Ghifari-Solution-/",
  apiUrl: "",
  sheetUrl: "",
  hasDailyTrigger: false,
  settings: {},
  products: [],
  hero: [],
  videos: [],
  sources: [],
  logs: []
};
var CUR_TAB = "produk";
var FILTER_CAT = "ALL";
var FILTER_BRAND = "ALL";

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function rp(n) {
  return "Rp" + Number(n || 0).toLocaleString("id-ID");
}
function resolveMedia(u) {
  u = String(u || "").trim();
  if (!u) return "";
  if (/^(https?:|data:|blob:)/i.test(u)) return u;
  return (STATE.siteUrl || "") + u.replace(/^\/+/, "");
}
function toast(msg, isErr) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("on"); }, 2800);
}

function refreshAll(silent) {
  if (!silent) document.getElementById("loadingMask").style.display = "flex";
  google.script.run
    .withSuccessHandler(function(d) {
      document.getElementById("loadingMask").style.display = "none";
      if (!d || !d.ok) { toast("Gagal memuat data panel.", true); return; }
      STATE = d;
      updateCounts();
      renderSidebar();
      renderMain();
      if (!silent) toast("Data tersinkron (" + d.updatedAt + ")");
    })
    .withFailureHandler(function(e) {
      document.getElementById("loadingMask").style.display = "none";
      toast("Error: " + (e && e.message ? e.message : e), true);
    })
    .getDashboardState();
}

function updateCounts() {
  var activeProd = STATE.products.filter(function(p){ return p.aktif; }).length;
  var flashCnt = STATE.products.filter(function(p){ return p.aktif && p.flash_sale; }).length;
  var vidCnt = STATE.videos.filter(function(v){ return v.aktif; }).length;
  var heroCnt = STATE.hero.filter(function(h){ return h.aktif; }).length;
  document.getElementById("cntProd").textContent = activeProd;
  document.getElementById("cntFlash").textContent = flashCnt;
  document.getElementById("cntVid").textContent = vidCnt;
  document.getElementById("cntHero").textContent = heroCnt;
  document.getElementById("liveText").textContent = (STATE.userEmail ? STATE.userEmail + " • " : "") + "live • " + (STATE.updatedAt || "");
}

function switchTab(tab) {
  CUR_TAB = tab;
  [].forEach.call(document.querySelectorAll("#navTabs button"), function(b) {
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  renderSidebar();
  renderMain();
}

function setFilter(cat, brand) {
  FILTER_CAT = cat;
  FILTER_BRAND = brand;
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  var sb = document.getElementById("sidebar");
  if (CUR_TAB !== "produk" && CUR_TAB !== "flash") {
    var html = '<div class="sb-sec"><div class="sb-title">NAVIGASI CEPAT</div>';
    html += '<button class="sb-item ' + (CUR_TAB === "video" ? "active" : "") + '" onclick="switchTab(\'video\')"><span class="sb-dot"></span><span class="sb-name">Video Trending</span><span class="sb-cnt">' + STATE.videos.length + '</span></button>';
    html += '<button class="sb-item ' + (CUR_TAB === "banner" ? "active" : "") + '" onclick="switchTab(\'banner\')"><span class="sb-dot"></span><span class="sb-name">Banner Hero</span><span class="sb-cnt">' + STATE.hero.length + '</span></button>';
    html += '<button class="sb-item ' + (CUR_TAB === "setting" ? "active" : "") + '" onclick="switchTab(\'setting\')"><span class="sb-dot"></span><span class="sb-name">Pengaturan</span></button>';
    html += '<button class="sb-item ' + (CUR_TAB === "log" ? "active" : "") + '" onclick="switchTab(\'log\')"><span class="sb-dot dim"></span><span class="sb-name">Log Perubahan Harga</span><span class="sb-cnt">' + STATE.logs.length + '</span></button>';
    html += '</div>';
    if (STATE.siteUrl) {
      html += '<div class="sb-sec"><div class="sb-title">TAUTAN LANGSUNG</div>';
      html += '<a class="sb-item" target="_blank" href="' + esc(STATE.siteUrl) + '"><span class="sb-dot"></span><span class="sb-name">Lihat Website Live ↗</span></a>';
      if (STATE.sheetUrl) html += '<a class="sb-item" target="_blank" href="' + esc(STATE.sheetUrl) + '"><span class="sb-dot dim"></span><span class="sb-name">Buka Google Sheets ↗</span></a>';
      html += '</div>';
    }
    sb.innerHTML = html;
    return;
  }

  var sourceList = CUR_TAB === "flash" ? STATE.products.filter(function(p){ return p.flash_sale; }) : STATE.products;
  var cats = {};
  var brands = {};
  sourceList.forEach(function(p) {
    cats[p.kategori || "Lainnya"] = (cats[p.kategori || "Lainnya"] || 0) + 1;
    if (p.brand) brands[p.brand] = (brands[p.brand] || 0) + 1;
  });

  var out = '<div class="sb-sec"><div class="sb-title">KATEGORI</div>';
  out += '<button class="sb-item ' + (FILTER_CAT === "ALL" && FILTER_BRAND === "ALL" ? "active" : "") + '" onclick="setFilter(\'ALL\',\'ALL\')"><span class="sb-dot"></span><span class="sb-name">Semua Produk</span><span class="sb-cnt">' + sourceList.length + '</span></button>';
  Object.keys(cats).sort().forEach(function(c) {
    var active = (FILTER_CAT === c && FILTER_BRAND === "ALL");
    out += '<button class="sb-item ' + (active ? "active" : "") + '" onclick="setFilter(\'' + esc(c).replace(/'/g,"\\'") + '\',\'ALL\')"><span class="sb-dot"></span><span class="sb-name">' + esc(c) + '</span><span class="sb-cnt">' + cats[c] + '</span></button>';
  });
  out += '</div>';

  var brandKeys = Object.keys(brands).sort();
  out += '<div class="sb-sec"><div class="sb-title">MERK (' + brandKeys.length + ')</div>';
  brandKeys.forEach(function(b) {
    var active = (FILTER_BRAND === b);
    out += '<button class="sb-item ' + (active ? "active" : "") + '" onclick="setFilter(\'' + esc(FILTER_CAT).replace(/'/g,"\\'") + '\',\'' + esc(b).replace(/'/g,"\\'") + '\')"><span class="sb-dot"></span><span class="sb-name">' + esc(b) + '</span><span class="sb-cnt">' + brands[b] + '</span></button>';
  });
  out += '</div>';
  sb.innerHTML = out;
}

function getFilteredProducts(onlyFlash) {
  var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  return STATE.products.filter(function(p) {
    if (onlyFlash && !p.flash_sale) return false;
    if (FILTER_CAT !== "ALL" && p.kategori !== FILTER_CAT) return false;
    if (FILTER_BRAND !== "ALL" && p.brand !== FILTER_BRAND) return false;
    if (q && (p.nama + " " + p.brand + " " + p.kategori).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function renderMain() {
  var el = document.getElementById("contentArea");
  if (CUR_TAB === "produk") { el.innerHTML = buildProdukView(false); return; }
  if (CUR_TAB === "flash") { el.innerHTML = buildProdukView(true); return; }
  if (CUR_TAB === "video") { el.innerHTML = buildVideoView(); return; }
  if (CUR_TAB === "banner") { el.innerHTML = buildBannerView(); return; }
  if (CUR_TAB === "setting") { el.innerHTML = buildSettingView(); return; }
  if (CUR_TAB === "log") { el.innerHTML = buildLogView(); return; }
}

function buildProdukView(onlyFlash) {
  var rows = getFilteredProducts(onlyFlash);
  if (onlyFlash) rows.sort(function(a, b) { return (a.urutan_flash || 999) - (b.urutan_flash || 999); });
  var title = onlyFlash ? "Flash Sale Hari Ini" : (FILTER_BRAND !== "ALL" ? FILTER_BRAND : (FILTER_CAT !== "ALL" ? "Kategori: " + FILTER_CAT : "Semua Produk"));
  var activeCnt = rows.filter(function(p){ return p.aktif; }).length;

function toggleProd(rowIndex, field, inputEl) {
  var val = !!inputEl.checked;
  inputEl.disabled = true;

    .withSuccessHandler(function(res) {
      inputEl.disabled = false;
      if (!res || !res.ok) { inputEl.checked = !val; toast((res && res.message) || "Gagal menyimpan toggle", true); return; }
      var item = STATE.products.filter(function(p){ return p.rowIndex === rowIndex; })[0];
      if (item) item[field] = val;
      updateCounts();
      toast((item ? item.nama : "Produk") + ": " + field + (val ? " ON" : " OFF"));
    })
    .withFailureHandler(function(e) {
      inputEl.disabled = false;
      inputEl.checked = !val;
      toast("Error: " + e.message, true);
    })
    .toggleProductField(rowIndex, field, val);
}

/* ==================== UPLOAD MEDIA KE GOOGLE DRIVE ==================== */
function compressImageIfNeeded(file, cb) {
  if (!file.type || file.type.indexOf("image/") !== 0 || file.size < 450000) {
    var fr = new FileReader();
    fr.onload = function(){ cb(String(fr.result).split(",")[1], file.type || "application/octet-stream"); };
    fr.readAsDataURL(file);
    return;
  }
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    var maxW = 1400;
    var w = img.width, h = img.height;
    if (w > maxW || h > maxW) {
      if (w >= h) { h = Math.round(h * maxW / w); w = maxW; }
      else { w = Math.round(w * maxW / h); h = maxW; }
    }
    var cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    var outType = file.type === "image/png" ? "image/png" : "image/jpeg";
    var dataUrl = cv.toDataURL(outType, 0.9);
    cb(dataUrl.split(",")[1], outType);
  };
  img.onerror = function() {
    URL.revokeObjectURL(url);
    var fr = new FileReader();
    fr.onload = function(){ cb(String(fr.result).split(",")[1], file.type || "image/jpeg"); };
    fr.readAsDataURL(file);
  };
  img.src = url;
}

function triggerDriveUpload(inputId, previewId, folderType, acceptType, extraTypeSelectId) {
  var fi = document.createElement("input");
  fi.type = "file";
  fi.accept = acceptType || "image/*";
  fi.onchange = function() {
    var file = fi.files && fi.files[0];
    if (!file) return;
    if (file.type && file.type.indexOf("video/") === 0 && file.size > 16 * 1024 * 1024) {
      toast("Video > 16 MB terlalu besar untuk upload langsung. Upload manual ke Google Drive / YouTube lalu tempel linknya.", true);
      return;
    }
    toast("Mengupload " + file.name + " ke Google Drive...");
    var doneCb = function(base64, mimeType) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.ok) { toast("Upload gagal.", true); return; }
          var inp = document.getElementById(inputId);
          if (inp) inp.value = res.url;
          if (previewId && res.tipe === "image") {
            var pv = document.getElementById(previewId);
            if (pv) pv.src = res.url;
          }
          if (extraTypeSelectId && res.tipe === "gdrive") {
            var sel = document.getElementById(extraTypeSelectId);
            if (sel) sel.value = "gdrive";
          }
          toast("Upload berhasil: " + res.fileName);
        })
        .withFailureHandler(function(e) {
          toast("Upload error: " + (e && e.message ? e.message : e), true);
        })
        .uploadMediaToDrive({ base64: base64, mimeType: mimeType, fileName: file.name, folderType: folderType });
    };

    if (file.type && file.type.indexOf("image/") === 0) {
      compressImageIfNeeded(file, doneCb);
    } else {
      var fr = new FileReader();
      fr.onload = function(){ doneCb(String(fr.result).split(",")[1], file.type || "application/octet-stream"); };
      fr.readAsDataURL(file);
    }
  };
  fi.click();
}

  b += '<div class="fg"><label>Link Video (YouTube / Google Drive) atau Upload MP4</label><div class="up-row"><input type="text" id="mvUrl" value="' + esc(v.video_url) + '" placeholder="https://youtube.com/watch?v=... atau upload file"><button type="button" class="btn-up" onclick="triggerDriveUpload(\'mvUrl\',null,\'Video\',\'video/*\',\'mvTipe\')">🎬 Upload Video</button></div><small style="color:var(--mute);font-size:11px">Upload langsung mendukung file <= 16 MB. Untuk video besar atau terbaru, tempel link YouTube/Drive.</small></div>';
  b += '<div class="fg"><label>Gambar Poster / Thumbnail (opsional jika YouTube)</label><div class="up-row"><img class="up-preview" id="pvVidPos" src="' + esc(resolveMedia(v.poster_url)) + '" onerror="this.src=\'\'"><input type="text" id="mvPoster" value="' + esc(v.poster_url) + '"><button type="button" class="btn-up" onclick="triggerDriveUpload(\'mvPoster\',\'pvVidPos\',\'Video\',\'image/*\')">🖼 Upload Poster</button></div></div>';
  b += '<div style="display:flex;gap:18px"><label style="display:inline-flex;align-items:center;gap:6px"><span class="sw"><input type="checkbox" id="mvAktif" '+(v.aktif?'checked':'')+'><i></i></span> Aktif Tampil</label><label style="display:inline-flex;align-items:center;gap:6px"><span class="sw fs"><input type="checkbox" id="mvKunci" '+(v.kunci_manual?'checked':'')+'><i></i></span> Kunci (jangan ditimpa auto-update)</label></div>';

  var f = '<div>' + (v.rowIndex ? '<button class="btn btn-danger" onclick="removeVideo(' + v.rowIndex + ')">Hapus Video</button>' : '') + '</div>';
  f += '<div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitVideo(' + v.rowIndex + ')">💾 Simpan Video</button></div>';
  openModal(v.rowIndex ? "Edit & Upload Video Trending" : "Tambah Video Trending Baru", b, f);

    brand: document.getElementById("mvBrand").value.trim(),

  var v = STATE.videos.filter(function(x){ return x.rowIndex === rowIndex; })[0];
  if (!v) return;
  var copy = Object.assign({}, v); copy[key] = !!inp.checked;

}

function openSourceModal(rowIndex) {
  var s = rowIndex > 0 ? STATE.sources.filter(function(x){ return x.rowIndex === rowIndex; })[0] : null;

}

  var s = STATE.sources.filter(function(x){ return x.rowIndex === rowIndex; })[0];

  google.script.run.withSuccessHandler(function(){ s.aktif = copy.aktif; toast("Channel diperbarui."); }).saveSource(copy);

function runAutoVideos() {
  var btn = document.getElementById("btnAutoVid");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Mengambil dari YouTube..."; }
  google.script.run
    .withSuccessHandler(function(d){
      if (d && d.ok) { STATE = d; updateCounts(); renderSidebar(); renderMain(); toast("Video trending lintas merk berhasil diperbarui!"); }
    })
    .withFailureHandler(function(e){ if (btn) { btn.disabled = false; btn.textContent = "🔄 Update Video Lintas Merk"; } toast("Error: " + e.message, true); })
    .updateVideoTrendingFromWeb();
}
function toggleDaily(inp) {
  var on = !!inp.checked;
  google.script.run.withSuccessHandler(function(r){
    STATE.hasDailyTrigger = !!(r && r.hasDailyTrigger);
    toast(STATE.hasDailyTrigger ? "Auto-update harian 08:00 AKTIF" : "Auto-update harian DIMATIKAN");
  }).toggleDailyTrigger(on);
}
